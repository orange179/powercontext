<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献整理助手 - Research Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button.primary {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.primary:hover {
            background: #5568d3;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
        }

        .document-list {
            display: grid;
            gap: 15px;
        }

        .document-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }

        .document-item:hover {
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .document-item h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .document-item .meta {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .document-item .abstract {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .score {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .preference-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preference-tag {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .preference-tag.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        .tech-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.9em;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 文献整理助手</h1>
            <p>基于 <span class="tech-badge">seekdb</span> + <span class="tech-badge">PowerContext</span> 的智能文献检索与管理工具</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="docCount">0</div>
                <div class="label">文献总数</div>
            </div>
            <div class="stat-card">
                <div class="number" id="searchCount">0</div>
                <div class="label">检索次数</div>
            </div>
            <div class="stat-card">
                <div class="number" id="tagCount">0</div>
                <div class="label">标签数量</div>
            </div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('search')">🔍 检索文献</button>
                <button class="tab" onclick="switchTab('import')">📥 导入文献</button>
                <button class="tab" onclick="switchTab('preferences')">⚙️ 个人偏好</button>
                <button class="tab" onclick="switchTab('list')">📋 文献列表</button>
            </div>

            <div id="searchTab" class="tab-content active">
                <h2>语义检索（seekdb 集成）</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="输入关键词，如：机器学习、深度学习、NLP...">
                    <button class="primary" onclick="searchDocuments()">检索</button>
                </div>
                <div id="searchResults" class="document-list"></div>
            </div>

            <div id="importTab" class="tab-content">
                <h2>导入 CSV 文献数据</h2>
                <div class="form-group">
                    <label>CSV 内容（列：title, authors, abstract, keywords, notes, tags）</label>
                    <textarea id="csvInput" placeholder="title,authors,abstract,keywords,notes,tags&#10;论文标题,作者姓名,摘要内容,关键词1;关键词2,阅读笔记,标签1,标签2"></textarea>
                </div>
                <button class="primary" onclick="importDocuments()">导入</button>
                <div id="importResult" style="margin-top: 15px;"></div>
            </div>

            <div id="preferencesTab" class="tab-content">
                <h2>个人偏好设置（PowerContext 记忆存储）</h2>
                <p style="color: #666; margin-bottom: 15px;">选择你感兴趣的研究方向，系统将为你推荐相关文献</p>
                <div class="form-group">
                    <label>用户 ID</label>
                    <input type="text" id="userId" placeholder="输入你的用户 ID" value="user1">
                </div>
                <div class="form-group">
                    <label>偏好标签（点击选择）</label>
                    <div id="preferenceTags" class="preference-tags"></div>
                </div>
                <button class="primary" onclick="savePreferences()">保存偏好</button>
                <div id="preferenceResult" style="margin-top: 15px;"></div>
            </div>

            <div id="listTab" class="tab-content">
                <h2>所有文献</h2>
                <div id="documentList" class="document-list"></div>
            </div>
        </div>

        <footer>
            <p>Powered by <span class="tech-badge">seekdb</span> <span class="tech-badge">PowerContext</span> | Built with <span class="tech-badge">Qoder</span></p>
        </footer>
    </div>

    <script>
        // 模拟数据库（实际应使用 seekdb + PowerContext）
        let documents_db = [];
        let user_preferences_db = {};
        let searchCount = 0;
        let allTags = new Set();
        let selectedTags = new Set();

        // 示例数据
        const sampleData = [
            {
                id: "1",
                title: "Attention Is All You Need",
                authors: "Vaswani et al.",
                abstract: "The dominant sequence transduction models are based on complex recurrent or convolutional neural networks. We propose a new simple network architecture, the Transformer, based solely on attention mechanisms.",
                keywords: "Transformer,Attention,NLP",
                notes: "这篇论文提出了 Transformer 架构，是现代 NLP 的基础",
                tags: ["深度学习", "NLP", "Transformer"]
            },
            {
                id: "2",
                title: "BERT: Pre-training of Deep Bidirectional Transformers",
                authors: "Devlin et al.",
                abstract: "We introduce a new language representation model called BERT, which stands for Bidirectional Encoder Representations from Transformers.",
                keywords: "BERT,Pre-training,Bidirectional",
                notes: "BERT 通过预训练任务学习双向上下文表示",
                tags: ["深度学习", "NLP", "预训练"]
            },
            {
                id: "3",
                title: "Vector Search with seekdb",
                authors: "OceanBase Team",
                abstract: "seekdb provides hybrid search capabilities combining vector search, full-text search, and structured queries.",
                keywords: "seekdb,Vector Search,Database",
                notes: "seekdb 支持向量、全文和结构化混合检索",
                tags: ["数据库", "检索", "seekdb"]
            },
            {
                id: "4",
                title: "PowerContext: Context Management for AI Agents",
                authors: "OceanBase Team",
                abstract: "PowerContext is an open-source context service for AI agents, supporting HTTP API, MCP, and Python SDK.",
                keywords: "PowerContext,AI Agent,Memory",
                notes: "PowerContext 为 AI Agent 提供上下文和记忆管理",
                tags: ["AI Agent", "上下文", "PowerContext"]
            }
        ];

        // 初始化示例数据
        function initSampleData() {
            documents_db = sampleData;
            sampleData.forEach(doc => {
                doc.tags.forEach(tag => allTags.add(tag));
            });
            updateStats();
            renderPreferenceTags();
        }

        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            if (tabName === 'list') {
                loadDocuments();
            } else if (tabName === 'preferences') {
                loadPreferences();
            }
        }

        // 导入文献
        function importDocuments() {
            const csvContent = document.getElementById('csvInput').value;
            if (!csvContent.trim()) {
                showAlert('importResult', '请输入 CSV 内容', 'error');
                return;
            }

            try {
                const lines = csvContent.trim().split('\n');
                const headers = lines[0].split(',').map(h => h.trim());
                
                let imported = 0;
                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(',').map(v => v.trim());
                    if (values.length < headers.length) continue;
                    
                    const doc = {
                        id: String(documents_db.length + 1),
                        title: values[0] || '',
                        authors: values[1] || '',
                        abstract: values[2] || '',
                        keywords: values[3] || '',
                        notes: values[4] || '',
                        tags: (values[5] || '').split(',').map(t => t.trim()).filter(t => t)
                    };
                    
                    documents_db.push(doc);
                    doc.tags.forEach(tag => allTags.add(tag));
                    imported++;
                }
                
                showAlert('importResult', `成功导入 ${imported} 篇文献（seekdb 向量存储）`, 'success');
                document.getElementById('csvInput').value = '';
                updateStats();
                renderPreferenceTags();
            } catch (error) {
                showAlert('importResult', `导入失败: ${error.message}`, 'error');
            }
        }

        // 检索文献（模拟 seekdb 语义检索）
        function searchDocuments() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                showAlert('searchResults', '请输入检索关键词', 'error');
                return;
            }

            const results = [];
            
            documents_db.forEach(doc => {
                let score = 0;
                let matched = [];
                
                if (doc.title.toLowerCase().includes(query)) {
                    score += 0.4;
                    matched.push('标题');
                }
                if (doc.abstract.toLowerCase().includes(query)) {
                    score += 0.3;
                    matched.push('摘要');
                }
                if (doc.keywords.toLowerCase().includes(query)) {
                    score += 0.2;
                    matched.push('关键词');
                }
                doc.tags.forEach(tag => {
                    if (tag.toLowerCase().includes(query)) {
                        score += 0.1;
                        matched.push(`标签:${tag}`);
                    }
                });
                
                if (score > 0) {
                    results.push({ document: doc, score, matched });
                }
            });
            
            results.sort((a, b) => b.score - a.score);
            searchCount++;
            document.getElementById('searchCount').textContent = searchCount;
            
            if (results.length === 0) {
                document.getElementById('searchResults').innerHTML = '<div class="empty-state">未找到相关文献</div>';
            } else {
                renderSearchResults(results);
            }
        }

        // 渲染检索结果
        function renderSearchResults(results) {
            const html = results.map(r => `
                <div class="document-item">
                    <h3>${r.document.title} <span class="score">匹配度: ${(r.score * 100).toFixed(0)}%</span></h3>
                    <div class="meta">${r.document.authors}</div>
                    <div class="abstract">${r.document.abstract}</div>
                    <div class="tags">
                        ${r.document.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <div style="margin-top: 8px; color: #888; font-size: 0.85em;">
                        匹配字段: ${r.matched.join(', ')}
                    </div>
                </div>
            `).join('');
            document.getElementById('searchResults').innerHTML = html;
        }

        // 加载文献列表
        function loadDocuments() {
            if (documents_db.length === 0) {
                document.getElementById('documentList').innerHTML = '<div class="empty-state">暂无文献，请先导入</div>';
            } else {
                renderDocumentList(documents_db);
            }
        }

        // 渲染文献列表
        function renderDocumentList(docs) {
            const html = docs.map(doc => `
                <div class="document-item">
                    <h3>${doc.title}</h3>
                    <div class="meta">${doc.authors}</div>
                    <div class="abstract">${doc.abstract}</div>
                    <div class="tags">
                        ${doc.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            document.getElementById('documentList').innerHTML = html;
        }

        // 加载用户偏好（模拟 PowerContext）
        function loadPreferences() {
            const userId = document.getElementById('userId').value;
            if (user_preferences_db[userId]) {
                selectedTags = new Set(user_preferences_db[userId].preferred_tags || []);
            } else {
                selectedTags = new Set();
            }
            renderPreferenceTags();
        }

        // 渲染偏好标签
        function renderPreferenceTags() {
            const html = Array.from(allTags).map(tag => `
                <span class="preference-tag ${selectedTags.has(tag) ? 'selected' : ''}" 
                      onclick="toggleTag('${tag}')">${tag}</span>
            `).join('');
            document.getElementById('preferenceTags').innerHTML = html || '<span style="color: #888;">暂无标签，请先导入文献</span>';
        }

        // 切换标签选择
        function toggleTag(tag) {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
            } else {
                selectedTags.add(tag);
            }
            renderPreferenceTags();
        }

        // 保存偏好（模拟 PowerContext 记忆存储）
        function savePreferences() {
            const userId = document.getElementById('userId').value;
            if (!userId.trim()) {
                showAlert('preferenceResult', '请输入用户 ID', 'error');
                return;
            }

            user_preferences_db[userId] = {
                user_id: userId,
                preferred_tags: Array.from(selectedTags),
                reading_progress: {},
                search_history: []
            };
            
            showAlert('preferenceResult', '偏好已保存到 PowerContext 记忆存储', 'success');
        }

        // 更新统计
        function updateStats() {
            document.getElementById('docCount').textContent = documents_db.length;
            document.getElementById('tagCount').textContent = allTags.size;
        }

        // 显示提示
        function showAlert(elementId, message, type) {
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            const html = `<div class="alert ${alertClass}">${message}</div>`;
            document.getElementById(elementId).innerHTML = html;
            setTimeout(() => {
                document.getElementById(elementId).innerHTML = '';
            }, 3000);
        }

        // 初始化
        initSampleData();
    </script>
</body>
</html>
